<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Admin Panel - Spotify Distributor Finder</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 40px var(--shadow);
        }

        .login-form input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: var(--dark-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--spotify-green);
        }

        .login-button {
            width: 100%;
            padding: 15px;
            background: var(--spotify-green);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .login-button:hover {
            background: #1ed760;
        }

        .logs-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 40px var(--shadow);
        }

        .log-item {
            padding: 20px;
            margin: 15px 0;
            background: var(--dark-bg);
            border-radius: 12px;
            border-left: 4px solid var(--spotify-green);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .log-time {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .log-track {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 5px 0;
        }

        .log-distributor {
            display: inline-block;
            padding: 5px 15px;
            background: var(--spotify-green);
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .logout-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: var(--error-red);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--dark-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--spotify-green);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div id="loginSection" class="login-container">
            <h2 style="text-align: center; margin-bottom: 30px;">🔐 Admin Panel</h2>
            <form id="loginForm" class="login-form">
                <input type="text" id="username" placeholder="Kullanıcı Adı" required>
                <input type="password" id="password" placeholder="Şifre" required>
                <button type="submit" class="login-button">Giriş Yap</button>
            </form>
            <p id="loginError" style="color: var(--error-red); text-align: center; margin-top: 15px; display: none;"></p>
        </div>

        <!-- Admin Panel -->
        <div id="adminSection" style="display: none;">
            <button class="logout-button" onclick="logout()">Çıkış Yap</button>
            
            <div class="header">
                <h1>📊 Admin Panel</h1>
                <p class="subtitle">Tüm sorgulama logları</p>
            </div>

            <div class="logs-container">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="totalLogs">0</div>
                        <div class="stat-label">Toplam Sorgu</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="todayLogs">0</div>
                        <div class="stat-label">Bugün</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="successRate">0%</div>
                        <div class="stat-label">Başarı Oranı</div>
                    </div>
                </div>

                <h3>Son Sorgular</h3>
                <div id="logsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // Check if already logged in
        if (localStorage.getItem('adminToken')) {
            showAdmin();
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('adminToken', result.token);
                    showAdmin();
                } else {
                    errorEl.textContent = result.error || 'Giriş başarısız';
                    errorEl.style.display = 'block';
                }
            } catch (error) {
                errorEl.textContent = 'Bir hata oluştu';
                errorEl.style.display = 'block';
            }
        });

        function showAdmin() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'block';
            loadLogs();
            
            // Auto refresh every 10 seconds
            setInterval(loadLogs, 10000);
        }

        async function loadLogs() {
            const token = localStorage.getItem('adminToken');
            if (!token) return;

            try {
                const response = await fetch('/api/admin/logs', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    logout();
                    return;
                }

                const data = await response.json();
                
                // Update stats
                document.getElementById('totalLogs').textContent = data.stats.total;
                document.getElementById('todayLogs').textContent = data.stats.today;
                document.getElementById('successRate').textContent = data.stats.successRate + '%';

                // Display logs
                const container = document.getElementById('logsContainer');
                container.innerHTML = data.logs.map(log => `
                    <div class="log-item">
                        <div class="log-header">
                            <div class="log-time">🕐 ${new Date(log.timestamp).toLocaleString('tr-TR')}</div>
                            <span class="badge ${log.success ? 'high' : 'low'}">${log.success ? 'Başarılı' : 'Hata'}</span>
                        </div>
                        <div class="log-track">🎵 ${log.trackName || 'Bilinmeyen'} - ${log.artists || 'N/A'}</div>
                        <div style="color: var(--text-secondary); font-size: 0.9rem; margin: 5px 0;">
                            🔗 Track ID: ${log.trackId || 'N/A'}
                        </div>
                        ${log.distributor ? `<span class="log-distributor">📦 ${log.distributor}</span>` : ''}
                        ${log.confidence ? `<span style="margin-left: 10px; color: var(--text-secondary);">Güven: ${log.confidence}</span>` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load logs:', error);
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }
    </script>
</body>
</html>
